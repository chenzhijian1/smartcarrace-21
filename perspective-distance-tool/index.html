.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;perspective-distance-tool&quot;&gt;
  &lt;style&gt;
    #perspective-distance-tool { color: var(--foreground); }
    #perspective-distance-tool * { box-sizing: border-box; }
    #perspective-distance-tool .pdt-shell { display: grid; gap: 16px; }
    #perspective-distance-tool .pdt-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
    #perspective-distance-tool .pdt-toolbar .form-label { min-width: 128px; flex: 1 1 160px; }
    #perspective-distance-tool .pdt-steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    #perspective-distance-tool .pdt-step { padding: 8px 10px; border-bottom: 3px solid var(--border); color: var(--muted-foreground); min-width: 0; }
    #perspective-distance-tool .pdt-step strong { display: block; color: inherit; font-weight: 500; }
    #perspective-distance-tool .pdt-step.is-active { border-color: var(--viz-series-1); color: var(--foreground); }
    #perspective-distance-tool .pdt-step.is-done { border-color: var(--viz-series-2); color: var(--foreground); }
    #perspective-distance-tool .pdt-stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
    #perspective-distance-tool .pdt-pane { min-width: 0; }
    #perspective-distance-tool .pdt-pane-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 7px; }
    #perspective-distance-tool .pdt-pane-head strong { font-weight: 500; }
    #perspective-distance-tool .pdt-canvas-wrap { position: relative; width: 100%; min-height: 280px; display: grid; place-items: center; background: color-mix(in srgb, var(--muted) 55%, transparent); overflow: hidden; }
    #perspective-distance-tool canvas { display: block; max-width: 100%; max-height: 610px; width: auto; height: auto; cursor: crosshair; touch-action: none; }
    #perspective-distance-tool .pdt-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted-foreground); pointer-events: none; padding: 24px; text-align: center; }
    #perspective-distance-tool .pdt-status { min-height: 24px; color: var(--muted-foreground); }
    #perspective-distance-tool .pdt-calibration { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
    #perspective-distance-tool .pdt-calibration .form-label { flex: 1 1 120px; }
    #perspective-distance-tool .pdt-results { display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, .6fr); gap: 14px; align-items: start; }
    #perspective-distance-tool .pdt-current { padding: 12px; }
    #perspective-distance-tool .pdt-current-value { font-size: 1.85em; font-weight: 500; }
    #perspective-distance-tool .pdt-list { margin: 0; padding-left: 26px; max-height: 170px; overflow: auto; }
    #perspective-distance-tool .pdt-list li { padding: 5px 4px; }
    #perspective-distance-tool .pdt-list li::marker { color: var(--muted-foreground); }
    #perspective-distance-tool .pdt-error { color: var(--destructive); }
    #perspective-distance-tool .pdt-hidden { display: none !important; }
    @media (max-width: 760px) {
      #perspective-distance-tool .pdt-stage, #perspective-distance-tool .pdt-results { grid-template-columns: 1fr; }
      #perspective-distance-tool .pdt-steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #perspective-distance-tool .pdt-canvas-wrap { min-height: 220px; }
    }
  &lt;/style&gt;

  &lt;div class=&quot;pdt-shell&quot;&gt;
    &lt;div class=&quot;pdt-toolbar&quot;&gt;
      &lt;label class=&quot;form-label&quot;&gt;赛道图片
        &lt;input id=&quot;pdt-file&quot; class=&quot;form-control&quot; type=&quot;file&quot; accept=&quot;image/*&quot;&gt;
      &lt;/label&gt;
      &lt;button id=&quot;pdt-undo&quot; class=&quot;btn&quot; type=&quot;button&quot; disabled&gt;&lt;i data-lucide=&quot;undo-2&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;撤销点&lt;/button&gt;
      &lt;button id=&quot;pdt-reset&quot; class=&quot;btn btn-ghost&quot; type=&quot;button&quot; disabled&gt;&lt;i data-lucide=&quot;rotate-ccw&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;重新开始&lt;/button&gt;
      &lt;button id=&quot;pdt-download&quot; class=&quot;btn btn-ghost&quot; type=&quot;button&quot; disabled&gt;&lt;i data-lucide=&quot;download&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;导出校正图&lt;/button&gt;
    &lt;/div&gt;

    &lt;div class=&quot;pdt-steps&quot; aria-label=&quot;处理步骤&quot;&gt;
      &lt;div class=&quot;pdt-step is-active&quot; data-step=&quot;1&quot;&gt;&lt;strong&gt;1 上传图片&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;选择赛道照片&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;pdt-step&quot; data-step=&quot;2&quot;&gt;&lt;strong&gt;2 选择四角&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;左上开始，顺时针&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;pdt-step&quot; data-step=&quot;3&quot;&gt;&lt;strong&gt;3 二维标定&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;选择两条已知线&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;pdt-step&quot; data-step=&quot;4&quot;&gt;&lt;strong&gt;4 任意测量&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;每两点一组&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div id=&quot;pdt-status&quot; class=&quot;pdt-status&quot; role=&quot;status&quot;&gt;请选择一张图片。&lt;/div&gt;

    &lt;div class=&quot;pdt-stage&quot;&gt;
      &lt;section class=&quot;pdt-pane&quot;&gt;
        &lt;div class=&quot;pdt-pane-head&quot;&gt;&lt;strong&gt;原图与角点&lt;/strong&gt;&lt;span id=&quot;pdt-source-count&quot; class=&quot;text-small text-muted&quot;&gt;0 / 4&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;pdt-canvas-wrap&quot;&gt;
          &lt;canvas id=&quot;pdt-source&quot; aria-label=&quot;原图角点选择画布&quot;&gt;&lt;/canvas&gt;
          &lt;div id=&quot;pdt-source-empty&quot; class=&quot;pdt-empty&quot;&gt;上传图片后，依次点击左上、右上、右下、左下四个角点&lt;/div&gt;
        &lt;/div&gt;
      &lt;/section&gt;
      &lt;section class=&quot;pdt-pane&quot;&gt;
        &lt;div class=&quot;pdt-pane-head&quot;&gt;&lt;strong&gt;透视校正结果&lt;/strong&gt;&lt;span id=&quot;pdt-scale&quot; class=&quot;text-small text-muted&quot;&gt;未标定&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;pdt-canvas-wrap&quot;&gt;
          &lt;canvas id=&quot;pdt-output&quot; aria-label=&quot;透视校正与距离测量画布&quot;&gt;&lt;/canvas&gt;
          &lt;div id=&quot;pdt-output-empty&quot; class=&quot;pdt-empty&quot;&gt;选完四个角点后在此生成校正图&lt;/div&gt;
        &lt;/div&gt;
      &lt;/section&gt;
    &lt;/div&gt;

    &lt;div id=&quot;pdt-cal-panel&quot; class=&quot;pdt-calibration pdt-hidden&quot;&gt;
      &lt;label class=&quot;form-label&quot;&gt;标定线 1 距离
        &lt;input id=&quot;pdt-known-1&quot; class=&quot;form-control&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;any&quot; placeholder=&quot;例如 100&quot;&gt;
      &lt;/label&gt;
      &lt;label class=&quot;form-label&quot;&gt;标定线 2 距离
        &lt;input id=&quot;pdt-known-2&quot; class=&quot;form-control&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;any&quot; placeholder=&quot;留空则与线 1 相同&quot;&gt;
      &lt;/label&gt;
      &lt;label class=&quot;form-label&quot;&gt;单位
        &lt;input id=&quot;pdt-unit&quot; class=&quot;form-control&quot; type=&quot;text&quot; value=&quot;cm&quot; maxlength=&quot;12&quot;&gt;
      &lt;/label&gt;
      &lt;button id=&quot;pdt-cal-1&quot; class=&quot;btn btn-primary&quot; type=&quot;button&quot;&gt;&lt;i data-lucide=&quot;ruler&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;选择标定线 1&lt;/button&gt;
      &lt;button id=&quot;pdt-cal-2&quot; class=&quot;btn&quot; type=&quot;button&quot; disabled&gt;&lt;i data-lucide=&quot;ruler&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;选择标定线 2&lt;/button&gt;
    &lt;/div&gt;

    &lt;div id=&quot;pdt-results&quot; class=&quot;pdt-results pdt-hidden&quot;&gt;
      &lt;div class=&quot;card pdt-current&quot;&gt;
        &lt;div class=&quot;text-small text-muted&quot;&gt;最近一次测量&lt;/div&gt;
        &lt;div id=&quot;pdt-current-value&quot; class=&quot;pdt-current-value&quot;&gt;等待选择两点&lt;/div&gt;
        &lt;div id=&quot;pdt-current-detail&quot; class=&quot;text-small text-muted&quot;&gt;在校正图上依次点击起点和终点&lt;/div&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;pdt-pane-head&quot;&gt;
          &lt;strong&gt;测量记录&lt;/strong&gt;
          &lt;button id=&quot;pdt-clear&quot; class=&quot;btn btn-ghost&quot; type=&quot;button&quot; disabled&gt;&lt;i data-lucide=&quot;trash-2&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;清空&lt;/button&gt;
        &lt;/div&gt;
        &lt;ol id=&quot;pdt-list&quot; class=&quot;pdt-list&quot;&gt;&lt;li class=&quot;text-muted&quot;&gt;暂无记录&lt;/li&gt;&lt;/ol&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;perspective-distance-tool&#x27;);
    const $ = (id) =&gt; root.querySelector(&#x27;#&#x27; + id);
    const fileInput = $(&#x27;pdt-file&#x27;);
    const sourceCanvas = $(&#x27;pdt-source&#x27;);
    const outputCanvas = $(&#x27;pdt-output&#x27;);
    const sourceCtx = sourceCanvas.getContext(&#x27;2d&#x27;);
    const outputCtx = outputCanvas.getContext(&#x27;2d&#x27;);
    const state = {
      image: null, corners: [], corrected: null, phase: 1,
      calibrations: [], calibrationDraft: [], calibrationTarget: null,
      measurePending: [], measurements: [], unitsPerPixel: null,
      unit: &#x27;cm&#x27;, dragging: -1
    };
    const cornerNames = [&#x27;左上&#x27;, &#x27;右上&#x27;, &#x27;右下&#x27;, &#x27;左下&#x27;];
    const colors = {
      corner: &#x27;#ffca28&#x27;, edge: &#x27;#29b6f6&#x27;, calibration: &#x27;#ef5350&#x27;, measurement: &#x27;#66bb6a&#x27;, text: &#x27;#ffffff&#x27;, shadow: &#x27;#000000&#x27;
    };

    function setStatus(message, error = false) {
      const node = $(&#x27;pdt-status&#x27;);
      node.textContent = message;
      node.classList.toggle(&#x27;pdt-error&#x27;, error);
    }

    function setPhase(phase) {
      state.phase = phase;
      root.querySelectorAll(&#x27;.pdt-step&#x27;).forEach((node) =&gt; {
        const step = Number(node.dataset.step);
        node.classList.toggle(&#x27;is-active&#x27;, step === phase);
        node.classList.toggle(&#x27;is-done&#x27;, step &lt; phase);
      });
    }

    function canvasPoint(event, canvas) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * canvas.width / rect.width,
        y: (event.clientY - rect.top) * canvas.height / rect.height
      };
    }

    function marker(ctx, p, label, color, radius = 7) {
      ctx.save();
      ctx.fillStyle = color;
      ctx.strokeStyle = colors.shadow;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.font = &#x27;500 14px sans-serif&#x27;;
      ctx.lineWidth = 3;
      ctx.strokeStyle = colors.shadow;
      ctx.strokeText(label, p.x + 10, p.y - 10);
      ctx.fillStyle = colors.text;
      ctx.fillText(label, p.x + 10, p.y - 10);
      ctx.restore();
    }

    function line(ctx, a, b, color, label) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(2, Math.min(ctx.canvas.width, ctx.canvas.height) / 350);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      marker(ctx, a, &#x27;&#x27;, color, 5); marker(ctx, b, &#x27;&#x27;, color, 5);
      if (label) {
        const x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
        const fontSize = Math.max(24, Math.min(42, Math.round(Math.min(ctx.canvas.width, ctx.canvas.height) / 24)));
        const boxHeight = fontSize + 12;
        ctx.font = `500 ${fontSize}px sans-serif`;
        const w = ctx.measureText(label).width + 20;
        ctx.fillStyle = &#x27;rgba(0,0,0,.72)&#x27;;
        ctx.fillRect(x - w / 2, y - boxHeight - 8, w, boxHeight);
        ctx.fillStyle = colors.text;
        ctx.textAlign = &#x27;center&#x27;;
        ctx.fillText(label, x, y - 16);
      }
      ctx.restore();
    }

    function drawSource() {
      if (!state.image) return;
      sourceCtx.clearRect(0, 0, sourceCanvas.width, sourceCanvas.height);
      sourceCtx.drawImage(state.image, 0, 0);
      if (state.corners.length &gt; 1) {
        sourceCtx.save();
        sourceCtx.strokeStyle = colors.edge; sourceCtx.lineWidth = 3;
        sourceCtx.beginPath(); sourceCtx.moveTo(state.corners[0].x, state.corners[0].y);
        state.corners.slice(1).forEach(p =&gt; sourceCtx.lineTo(p.x, p.y));
        if (state.corners.length === 4) sourceCtx.closePath();
        sourceCtx.stroke(); sourceCtx.restore();
      }
      state.corners.forEach((p, i) =&gt; marker(sourceCtx, p, `${i + 1} ${cornerNames[i]}`, colors.corner));
      $(&#x27;pdt-source-count&#x27;).textContent = `${state.corners.length} / 4`;
    }

    function drawOutput() {
      if (!state.corrected) return;
      outputCtx.putImageData(state.corrected, 0, 0);
      state.calibrations.forEach((cal, i) =&gt; line(outputCtx, cal.points[0], cal.points[1], colors.calibration, `标定线 ${i + 1} · ${formatDistance(cal.known)}`));
      if (state.calibrationDraft.length === 1) marker(outputCtx, state.calibrationDraft[0], `标定线 ${(state.calibrationTarget ?? 0) + 1} 起点`, colors.calibration);
      state.measurements.forEach((m, i) =&gt; line(outputCtx, m.a, m.b, colors.measurement, `${i + 1}. ${formatDistance(m.value)}`));
      if (state.measurePending.length === 1) marker(outputCtx, state.measurePending[0], &#x27;起点&#x27;, colors.measurement);
    }

    function distance(a, b) { return Math.hypot(b.x - a.x, b.y - a.y); }

    function solveLinear(A, b) {
      const n = b.length;
      for (let col = 0; col &lt; n; col++) {
        let pivot = col;
        for (let row = col + 1; row &lt; n; row++) if (Math.abs(A[row][col]) &gt; Math.abs(A[pivot][col])) pivot = row;
        if (Math.abs(A[pivot][col]) &lt; 1e-10) throw new Error(&#x27;角点位置无法生成稳定的透视变换&#x27;);
        [A[col], A[pivot]] = [A[pivot], A[col]];
        [b[col], b[pivot]] = [b[pivot], b[col]];
        const div = A[col][col];
        for (let j = col; j &lt; n; j++) A[col][j] /= div;
        b[col] /= div;
        for (let row = 0; row &lt; n; row++) {
          if (row === col) continue;
          const f = A[row][col];
          for (let j = col; j &lt; n; j++) A[row][j] -= f * A[col][j];
          b[row] -= f * b[col];
        }
      }
      return b;
    }

    function homography(from, to) {
      const A = [], b = [];
      for (let i = 0; i &lt; 4; i++) {
        const x = from[i].x, y = from[i].y, u = to[i].x, v = to[i].y;
        A.push([x, y, 1, 0, 0, 0, -u*x, -u*y]); b.push(u);
        A.push([0, 0, 0, x, y, 1, -v*x, -v*y]); b.push(v);
      }
      return solveLinear(A, b);
    }

    function isValidQuad(p) {
      if (p.length !== 4) return false;
      let sign = 0;
      for (let i = 0; i &lt; 4; i++) {
        const a = p[i], b = p[(i + 1) % 4], c = p[(i + 2) % 4];
        const cross = (b.x - a.x) * (c.y - b.y) - (b.y - a.y) * (c.x - b.x);
        if (Math.abs(cross) &lt; 1) return false;
        if (!sign) sign = Math.sign(cross);
        else if (Math.sign(cross) !== sign) return false;
      }
      return true;
    }

    function createCorrection() {
      if (!isValidQuad(state.corners)) {
        setStatus(&#x27;四个角点必须按顺时针排列，且不能交叉或接近同一直线。&#x27;, true);
        return false;
      }
      const [tl, tr, br, bl] = state.corners;
      let width = Math.round(Math.max(distance(tl, tr), distance(bl, br)));
      let height = Math.round(Math.max(distance(tl, bl), distance(tr, br)));
      if (width &lt; 20 || height &lt; 20) { setStatus(&#x27;选择区域太小，请重新选择角点。&#x27;, true); return false; }
      const maxSide = 1800, scale = Math.min(1, maxSide / Math.max(width, height));
      width = Math.max(2, Math.round(width * scale)); height = Math.max(2, Math.round(height * scale));
      const destination = [{x:0,y:0},{x:width-1,y:0},{x:width-1,y:height-1},{x:0,y:height-1}];
      let H;
      try { H = homography(destination, state.corners); }
      catch (error) { setStatus(error.message, true); return false; }
      const sourceData = document.createElement(&#x27;canvas&#x27;);
      sourceData.width = sourceCanvas.width; sourceData.height = sourceCanvas.height;
      const tempCtx = sourceData.getContext(&#x27;2d&#x27;); tempCtx.drawImage(state.image, 0, 0);
      const src = tempCtx.getImageData(0, 0, sourceData.width, sourceData.height);
      const dst = outputCtx.createImageData(width, height);
      const sw = src.width, sh = src.height, sd = src.data, dd = dst.data;
      for (let y = 0; y &lt; height; y++) {
        for (let x = 0; x &lt; width; x++) {
          const den = H[6]*x + H[7]*y + 1;
          const sx = (H[0]*x + H[1]*y + H[2]) / den;
          const sy = (H[3]*x + H[4]*y + H[5]) / den;
          const ix = Math.max(0, Math.min(sw - 1, Math.round(sx)));
          const iy = Math.max(0, Math.min(sh - 1, Math.round(sy)));
          const si = (iy * sw + ix) * 4, di = (y * width + x) * 4;
          dd[di] = sd[si]; dd[di+1] = sd[si+1]; dd[di+2] = sd[si+2]; dd[di+3] = 255;
        }
      }
      outputCanvas.width = width; outputCanvas.height = height;
      state.corrected = dst;
      state.calibrations = []; state.calibrationDraft = []; state.calibrationTarget = null;
      state.measurePending = []; state.measurements = []; state.unitsPerPixel = null;
      drawOutput();
      $(&#x27;pdt-output-empty&#x27;).classList.add(&#x27;pdt-hidden&#x27;);
      $(&#x27;pdt-cal-panel&#x27;).classList.remove(&#x27;pdt-hidden&#x27;);
      $(&#x27;pdt-cal-2&#x27;).disabled = true;
      $(&#x27;pdt-results&#x27;).classList.add(&#x27;pdt-hidden&#x27;);
      $(&#x27;pdt-download&#x27;).disabled = false;
      $(&#x27;pdt-scale&#x27;).textContent = `${width} × ${height} px · 未标定`;
      setPhase(3);
      setStatus(&#x27;透视校正已生成。输入两条不同方向线段的已知距离，先选择标定线 1。&#x27;);
      return true;
    }

    function formatDistance(value) {
      const precision = value &gt;= 100 ? 1 : value &gt;= 10 ? 2 : 3;
      return `${Number(value.toFixed(precision))} ${state.unit}`;
    }

    function renderMeasurements() {
      const list = $(&#x27;pdt-list&#x27;);
      if (!state.measurements.length) list.innerHTML = &#x27;&lt;li class=&quot;text-muted&quot;&gt;暂无记录&lt;/li&gt;&#x27;;
      else list.innerHTML = state.measurements.map((m, i) =&gt; `&lt;li&gt;测量 ${i + 1}：&lt;strong&gt;${formatDistance(m.value)}&lt;/strong&gt;&lt;/li&gt;`).join(&#x27;&#x27;);
      $(&#x27;pdt-clear&#x27;).disabled = state.measurements.length === 0 &amp;&amp; state.measurePending.length === 0;
      drawOutput();
    }

        if (state.calibrationTarget === null) { setStatus(&#x27;请先点击“选择标定线 1”或“选择标定线 2”。&#x27;, true); return; }
        state.calibrationDraft.push(p);
        if (state.calibrationDraft.length === 2) {

      state.measurePending = []; state.measurements = []; state.unitsPerPixel = null;

      $(&#x27;pdt-output-empty&#x27;).classList.remove(&#x27;pdt-hidden&#x27;); $(&#x27;pdt-cal-panel&#x27;).classList.add(&#x27;pdt-hidden&#x27;); $(&#x27;pdt-results&#x27;).classList.add(&#x27;pdt-hidden&#x27;);

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;

    if (tooltip == null) {

      tooltip.id = tooltipId;

    );

    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();

      return;

              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );

        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);

    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {

    });

    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {

    }

  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }

  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {

    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }

    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);

})();
&lt;/script&gt;

(() =&gt; {
